services:
  postgres:
    image: postgres:16-alpine
    container_name: dropship_bot_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dropshipping_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bot:
    build: .
    container_name: dropship_bot_app
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/dropshipping_db?schema=public
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      - postgres

volumes:
  postgres_data:
